<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz dos Escudos de Futebol</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Biblioteca Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Nosso código cliente -->
    <script src="client.js" defer></script>
</head>

<body>
    <!-- Tela de Entrada -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1>Quiz dos Escudos</h1>
            <p class="subtitle">Teste seus conhecimentos sobre futebol</p>

            <div class="game-explanation">
                <h2>Como Jogar</h2>
                <ul>
                    <li>Um escudo de time aparecerá na tela</li>
                    <li>Digite o nome correto do time</li>
                    <li>Cada acerto vale 1 ponto</li>
                    <li>Você tem 15 segundos para responder</li>
                    <li>Compete com outros jogadores em tempo real</li>
                </ul>
            </div>

            <div class="login-form">
                <input type="text" id="username" placeholder="Digite seu nome" maxlength="20">
                <button id="start-game">Começar Jogo</button>
            </div>
        </div>
    </div>

    <!-- Tela do Jogo -->
    <div id="game-screen" class="screen hidden">
        <div class="game-container">
            <div class="game-area">
                <div class="game-info">
                    <h1>Quiz dos Escudos</h1>
                </div>

                <div class="shield-container">
                    <img id="escudo" src="" alt="Escudo aparecerá aqui">
                </div>
                <div class="answer-section">
                    <input type="text" id="resposta" placeholder="Digite o nome do time">
                    <button id="enviar-resposta">Enviar</button>
                </div>
            </div>

            <div class="ranking-area">
                <h2>Ranking</h2>
                <div id="ranking-list"></div>
            </div>
        </div>
    </div>
</body>

</html>
