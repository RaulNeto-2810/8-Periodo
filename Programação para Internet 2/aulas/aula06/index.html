<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Crud de alunos</h1>
    <!-- Formulário para adicionar um novo registro -->
    <form id="aluno-form">
        <input type="text" name="nome" id="nome" placeholder="Digite o nome do aluno" required>
        <input type="number" name="idade" id="idade" placeholder="Digite a idade do aluno" required>
        <input type="text" name="curso" id="curso" placeholder="Digite o curso do aluno" required>
        <button type="submit">Adicionar</button>
    </form>
    <!-- Lista de alunos cadastrados -->
    <h2>Lista de Alunos</h2>
    <ul id="aluno-list">

    </ul>
</body>
</html>
